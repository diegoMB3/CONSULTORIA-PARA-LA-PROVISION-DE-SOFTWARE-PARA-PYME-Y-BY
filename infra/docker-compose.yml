services:
  # 1. Base de Datos Principal
  postgres_bdp:
    image: postgres:15-alpine
    container_name: bdp_database
    environment:
      POSTGRES_DB: bdp_credit_db
      POSTGRES_USER: bdp_admin
      POSTGRES_PASSWORD: Bdp2024Secure!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bdp_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bdp_admin -d bdp_credit_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Axon Server (disponible para futuras integraciones; el backend no depende de el)
  axonserver:
    image: axoniq/axonserver:2024.2.1
    container_name: bdp_axon_server
    environment:
      - AXONIQ_AXONSERVER_STANDALONE=true
    ports:
      - "8024:8024"
      - "8124:8124"
    volumes:
      - axon_data:/data
    networks:
      - bdp_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8024/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # 3. Simulador del CORE Bancario
  core_simulator:
    image: wiremock/wiremock:3.10.0
    container_name: bdp_core_mock
    ports:
      - "8081:8080"
    volumes:
      - ./wiremock:/home/wiremock
    networks:
      - bdp_net

  # 4. BACKEND - Spring Boot Application
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: bdp_backend
    ports:
      - "8080:8080"
    depends_on:
      postgres_bdp:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres_bdp:5432/bdp_credit_db
      - SPRING_DATASOURCE_USERNAME=bdp_admin
      - SPRING_DATASOURCE_PASSWORD=Bdp2024Secure!
      - AXON_AXONSERVER_ENABLED=false
      - SPRING_AUTOCONFIGURE_EXCLUDE=org.axonframework.spring.config.AxonAutoConfiguration
    networks:
      - bdp_net

  pgadmin:
    image: dpage/pgadmin4:8.4
    container_name: bdp_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bdp.com.bo
      PGADMIN_DEFAULT_PASSWORD: Bdp2024Secure!
      # Desactivar advertencias de seguridad en entorno local de desarrollo
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: 10
    ports:
      - "5050:80"
    networks:
      - bdp_net
    depends_on:
      - postgres_bdp
    volumes:
      - pgadmin_data:/var/lib/pgadmin

networks:
  bdp_net:
    driver: bridge

volumes:
  postgres_data:
  axon_data:
  pgadmin_data: