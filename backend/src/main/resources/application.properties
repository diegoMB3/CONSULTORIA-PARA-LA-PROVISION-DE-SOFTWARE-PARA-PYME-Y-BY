spring.application.name=bdp-credit-backend

# Base de Datos PostgreSQL (para Docker)
spring.datasource.url=jdbc:postgresql://postgres_bdp:5432/bdp_credit_db
spring.datasource.username=bdp_admin
spring.datasource.password=Bdp2024Secure!
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console (para desarrollo)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Axon Server (deshabilitado para desarrollo local)
# axon.axonserver.servers=localhost:8124
axon.serializer.events=jackson
axon.serializer.commands=jackson
axon.serializer.queries=jackson

# Logging
logging.level.org.axonframework=INFO
logging.level.bo.gob.bdp.sam=DEBUG
