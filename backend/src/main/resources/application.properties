spring.application.name=bdp-credit-backend

# Base de Datos H2 (para desarrollo sin Docker)
spring.datasource.url=jdbc:h2:mem:bdp_sam;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console (para desarrollo)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Axon Server (deshabilitado para desarrollo local)
axon.axonserver.enabled=false
axon.axonserver.servers=
# axon.axonserver.servers=localhost:8124
axon.serializer.events=jackson
axon.serializer.commands=jackson
axon.serializer.queries=jackson

# Logging
logging.level.org.axonframework=INFO
logging.level.bo.gob.bdp.sam=DEBUG

# Management / Actuator: exponer health y mostrar detalles localmente
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
# Desactivar el health indicator de Axon para que la app sea "UP" sin Axon Server
management.health.axon.enabled=false
management.health.axonServer.enabled=false
management.health.axon-server.enabled=false

# Desactivar autoconfiguración de Axon en local (usaremos un stub para CommandGateway)
spring.autoconfigure.exclude=org.axonframework.spring.config.AxonAutoConfiguration
