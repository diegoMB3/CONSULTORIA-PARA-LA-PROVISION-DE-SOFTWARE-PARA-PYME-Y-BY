spring.application.name=bdp-credit-backend

# Base de Datos local (H2) para desarrollo
spring.datasource.url=jdbc:h2:mem:bdp_credit_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (para desarrollo)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Axon Server (deshabilitado para desarrollo local)
axon.axonserver.enabled=false
axon.axonserver.suppressDownloadMessage=true
# axon.axonserver.servers=localhost:8124
axon.serializer.events=jackson
axon.serializer.queries=jackson

# Logging
logging.level.org.axonframework=INFO
logging.level.bo.gob.bdp.sam=DEBUG
